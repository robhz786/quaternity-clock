<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
     * {
         margin: 0;
         box-sizing: border-box;
     }

     /*https://stackoverflow.com/questions/3790935/can-i-hide-the-html5-number-input-s-spin-box*/
     input::-webkit-outer-spin-button,
     input::-webkit-inner-spin-button {
         /* display: none; <- Crashes Chrome on hover */
         -webkit-appearance: none;
         margin: 0; /* <-- Apparently some margin are still there even though it's hidden */
     }
     input[type="number"] {
         -moz-appearance:textfield;
     }
     legend {
         display: block; /* Treat the legend as a block-level element */
         width: auto; /* Allow the width to adjust to content, or set a specific width */
         margin-left: auto;
         margin-right: auto;
         /* or shorthand: margin: 0 auto; */
         text-align: center; /* To center the text within the centered legend */
     }

     #game-panel,#confirm-terminate-panel-div,#start-panel-div,#keyboard-div,#paused-state-pannel,
     #undo-panel,#remove-players-panel,#unpause-buttons-div,#remove-player-button-div,
     #terminate-game-button-div,#undo-button-div,#new-game-button-div {
         display: none;
     }

     .when-not-on-fullscreen {
         display: block;
     }
     .when-on-fullscreen {
         display: none;
     }
     :fullscreen {
         .when-not-on-fullscreen {
             display: none;
         }
         .when-on-fullscreen {
             display: block;
         }
     }
     /* data-gamestate values:
        not-started, running, paused, confirm-terminate, undoing-move,
        removing-player, over
      */
     #quaternity-clock[data-gamestate="not-started"] {
         /*to avoid the background to became black when on fullscreen*/
         /*see https://stackoverflow.com/questions/16163089/background-element-goes-black-when-entering-fullscreen-with-html5*/
         background-color: white;
         /*::backdrop {
            background-color: white;
            }*/

         #start-panel-div {
             padding-top: 4vh;
             display: flex;
             flex-direction: column;
             align-items: center;
             height: 90vh;
             background-color: white;
             div.inside-legend {
                 display: none;
             }
             @media only screen and (aspect-ratio < 2) {
                 font-size: min(5vh, 6vw);
             }
             @media only screen and (2 <= aspect-ratio) {
                 font-size: 7vh
             }
             .time-inputs {
                 display: flex;
                 flex-direction: column;
                 align-items: center;
                 margin: auto;
                 fieldset {
                     width: 90vw;
                     background-color: beige;
                     display: flex;
                     flex-direction: row;
                     justify-content: space-evenly;
                     input {
                         font-size: min(8vh, 7vw);
                         text-align: right;
                         width: 2.4em;
                         height: 1.2em;
                     }
                     @media only screen and (1.6 <= aspect-ratio) {
                         justify-content: space-between;
                         legend {
                             display: none;
                         }
                         div.inside-legend {
                             display: block;
                         }
                     }
                 }
                 @media only screen and (4 <= aspect-ratio) {
                     flex-direction: row;
                     justify-conten: space-between;
                     width: 90vw;
                     fieldset { width: 45vw; }
                 }
             }
             #start-panel-buttons-div {
                 display: flex;
                 justify-content: space-between;
                 width: 90vw;
                 margin-bottom: 1em;
                 margin-top: 1em;
                 button {
                     height: 2em;
                     margin-top: 0.5em;
                 }
                 @media only screen and (aspect-ratio < 2) {
                     flex-direction: column;
                     align-items: center;
                     button {
                         font-size: min(7vh, 7vw);
                         width: 60vw;
                     }
                 }
                 @media only screen and (2 <= aspect-ratio) {
                     flex-direction: row;
                     justify-content: space-between;
                     button {
                         font-size: 8vh;
                         width: 40vw;
                     }
                 }
             }
             #start-button {
                 background-color: lightgreen;
                 font-weight: bold;
                 /*border: calc(0.15vh + 0.15vw) solid black;*/
             }
         }
     }
     #quaternity-clock[data-gamestate="confim-terminate"] {
         #confirm-terminate-panel-div {
             display: flex;
             flex-direction: column;
             font-size: min(12vh, 8vw);
             justify-content: center;
             align-items: center;
             text-align: center;
             div {
                 margin-top: 20vh;
             }
             @media only screen and (max-aspect-ratio: 8/5) {
                 div {
                     margin-top: 10vh;
                     display: flex;
                     flex-direction: column;
                     justify-content: center;
                     align-items: center;
                 }
             }
             button {
                 font-size: min(9vh, 6vw);
                 width: 40vw;
                 height: 2em;
                 margin-top: 10vh;
             }
         }
     }
     #quaternity-clock[data-gamestate="over"] {
         #new-game-button-div {
             display: flex;
         }
         .when-not-on-fullscreen, .when-on-fullscreen {
             display: none;
         }
     }
     #quaternity-clock[data-gamestate="over"],
     #quaternity-clock[data-gamestate="running"],
     #quaternity-clock[data-gamestate="paused"],
     #quaternity-clock[data-gamestate="undoing-move"],
     #quaternity-clock[data-gamestate^="removing-player"] {
         #game-panel {
             display: flex;
             min-height: 100vh;
             flex-direction: column;
             align-items: stretch;
             justify-content: center;
             text-align: center;
             background-color: black;
         }
         --players-columns-count: 1;
         .players-grid {
             grid-template-columns: repeat(var(--players-columns-count), 1fr);
         }
         .player2-cell {
             --column: min(var(--players-columns-count), 3);        /* 1 2 3 */
             --row: calc(4 - min(var(--players-columns-count), 3)); /* 3 2 1 */
             grid-column: var(--column) / span 1;
             grid-row: var(--row) / span 1;
         }
         .player3-cell {
             --column: calc(1 + 3 * round(down, calc(var(--players-columns-count) / 4))); /*1 1 4*/
             --row:    calc(4 / var(--players-columns-count));                            /*4 2 1*/
             grid-column: var(--column) / span 1;
             grid-row: var(--row) / span 1;
         }
         #clocks-container {
             /*https://stackoverflow.com/questions/9185434/using-svg-as-background-image*/
             column-gap: 2vw;
             row-gap: 2vh;
             /*gap: 10px;*/
             padding-left: 2vw;
             padding-right: 2vw;
             padding-top: 2vh;
             padding-bottom: 2vh;
             /*padding: 10px;*/
             background-color: black; /*rgb(100, 100, 100);*/
         }
         #unpause-buttons-container {
             display: flex;
             flex-direction: row;
             justify-content: space-around;
             div > svg {
                 width: min(15vh, 15vw);
                 height: min(15vh, 15vw);
             }
         }
     }
     #quaternity-clock[data-gamestate="running"] {
         #keyboard-div {
             display: block;
             background-color: rgba(0, 0, 0, 0.0);
             #pause-button {
                 font-size: min(12vh, 20vw);
             }
         }
         --players-columns-count: 1;
         @media only screen and (6/5 <= aspect-ratio) {
             --players-columns-count: 2;
         }
         .player-clock {
             font-size: min(22vh, 10vw);
         }
     }
     #quaternity-clock[data-gamestate="over"],
     #quaternity-clock[data-gamestate="paused"],
     #quaternity-clock[data-gamestate="undoing-move"] {
         --players-columns-count: 2;
         #clocks-container .player-clock {
             font-size: max(4.5vh, 2.5vw);
         }
         @media only screen and (1 <= aspect-ratio) {
             --players-columns-count: 4;
         }
     }
     #quaternity-clock[data-gamestate="over"],
     #quaternity-clock[data-gamestate="paused"]  {
         #paused-state-pannel {
             font-size: 5vh;
             background-color: rgb(155, 155, 155);
             display: flex;
             flex-direction: column;
             /*align-items: center;*/
             padding-left: 2vw;
             padding-right: 2vw;
             min-height: 75vh;
             .button-div {
                 justify-content: center;
                 align-items: center;
                 margin-bottom: 2vh;
             }
             button,legend {
                 font-size: min(5vh, 8vw);
             }
             #paused-panel-buttons-div {
                 margin-left: auto;
                 margin-right: auto;
                 width: 80vw;
                 @media only screen and (aspect-ratio < 1.2) {
                     display: flex;
                     flex-direction: column;
                     .button-div {
                         button {
                             width: 64vw;
                         }
                     }
                 }
                 @media only screen and (1.2 <= aspect-ratio ) {
                     display: grid;
                     grid-template-columns: auto auto;
                     row-gap: 1vh;
                     column-gap: 3vh;
                     .button-div {
                         button {
                             width: 100%;
                             height: 12vh;
                         }
                     }
                 }
                 @media only screen and (2.5 <= aspect-ratio ) {
                     display: flex;
                     flex-direction: row;
                     justify-content: space-around;
                     .button-div {
                         width: 28vw;
                         height: 20vh;
                         button {
                             height: 15vh;
                         }
                     }
                 }
             }
             #unpause-buttons-div {
                 padding-bottom: 2vh;
             }
         }
         #paused-title-div {
             border: calc(0.2vh + 0.2vw) solid black;
             background-color: white;
             margin-bottom: 2vh;
         }
         #paused-title {
             font-size: 8vh;
         }
         #paused-subtitle {
             font-size: 6vh;
         }
     }
     #quaternity-clock[data-gamestate="paused"] {
         #remove-player-button-div,#undo-button-div,
         #terminate-game-button-div,#unpause-buttons-div
         {
             display: block;
         }
     }
     #quaternity-clock[data-gamestate="removing-player"] {
         #paused-state-pannel, #clocks-container {
             display: none;
         }
         #remove-players-panel {
             font-size: 6vh;
             display: flex;
             flex-direction: column;
             background-color: beige;
             #resign-current-player-div, #checkmate-div {
                 display: flex;
                 flex-direction: row;
                 /*align-content: left;*/
                 text-align: left;
             }
             #checkmate-boxes {
                 margin-left: 4vw;
                 div {
                     margin-right: 2vw;
                 }
             }
             input {
                 width: 6vh;
                 height: 4vh;
             }
             #checkmate-boxes {
                 display: flex;
                 flex-direction: row;
                 padding-bottom: 10vh;
             }
             #remove-players-panel-buttons {
                 display: flex;
                 flex-direction: row;
                 justify-content: space-evenly;
                 button {
                     height: 15vh;
                     width: 40vw;
                     font-size: 6vh;
                     svg {
                         width: min(10vh, 10vw);
                         height: min(10vh, 10vw);
                     }
                 }
             }
         }
     }
     #quaternity-clock[data-gamestate="undoing-move"] {
         #undo-panel {
             display: flex;
             #game-history {
                 background-color: white;
                 div.header {
                     background-color: beige;
                     font-size: min(9vh, 9vw);
                 }
                 #history-events {
                     height:70vh;
                     font-size: min(7vh, 7vw);
                     overflow-y: scroll;
                     div {
                         text-align: left;
                         margin-left: 5%;
                     }
                     #undone-moves {
                         text-decoration: line-through;
                         color: darkgrey;
                     }
                     hr {
                         height: 1.2vh;
                         background-color: gray;
                         border-style: none;
                         border-radius: 0.6vh;
                         width: 90%;
                         margin-left: auto;
                         margin-right: auto;
                     }
                 }
             }
             #undo-redo-buttons {
                 background-color: beige;
                 button {
                     display: block;
                     font-size: min(7vh, 7vw);
                 }
             }
             @media only screen and (aspect-ratio < 1.5) {
                 flex-direction: column;
                 #game-history {
                     min-width: 90vw;
                     #history-events {
                         height: 55vh;
                     }
                 }
                 #undo-redo-buttons {
                     display: flex;
                     flex-direction: row;
                     justify-content: space-evenly;
                     button {
                         margin-top: 2vh;
                         margin-bottom: 2vh;
                     }
                 }
             }
             @media only screen and (aspect-ratio >= 1.5) {
                 flex-direction: row;
                 #game-history {
                     width: 80vw;
                     #history-events {
                         height:70vh;
                     }
                 }
                 #undo-redo-buttons {
                     width: 20vw
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding-left: 1vw;
                     padding-right: 1vw;
                     button {
                         margin-top: 8vh;
                         padding-top: 2vh;
                         padding-bottom: 2vh;
                         width: 16vw;
                     }
                 }
             }
         }
     }
     #clocks-container {
         display: grid;
         .player-clock {
             color: white;
             padding: 0.2vh; /*calc(0.2vh + 0.2vw);*/
             border: calc(0.2vh + 0.2vw) solid grey;
             font-size: 4vh;
             text-align: center;
             align-content: center;
             font-family: monospace;
         }
         .player-clock[data-playerstate="current"] {
             border: calc(0.5vh + 0.5vw) solid lightgray;
             box-shadow: 0 0 calc(0.6vh + 0.6vw) calc(0.8vh + 0.8vw) #e0f0ff;
             opacity: 1.0;
         }
         .player-clock[data-playerstate="waiting"] {
             /*opacity: 0.68;*/
         }
         .player-clock[data-playerstate="disabled"] {
             opacity: 0.34;
             text-decoration: line-through;
         }
         .player0-cell {
             background-color: white;
             color: black;
         }
         .player1-cell {
             background-color: red;
         }
         .player2-cell {
             background-color: black;
         }
         .player3-cell {
             background-color: green;
         }
     }
     svg.unpause-button {
         --player-color: gray;
         circle {
             stroke: var(--player-color);
         }
         polygon {
             fill: var(--player-color);
         }
     }
     svg.unpause-button[data-player-index='0'] {
         --player-color: white;
     }
     svg.unpause-button[data-player-index='1'] {
         --player-color: red;
     }
     svg.unpause-button[data-player-index='2'] {
         --player-color: black;
     }
     svg.unpause-button[data-player-index='3'] {
         --player-color: green;
     }
    </style>
    <script src="quaternity_clock.js"></script>
    <script>
     const playersNames = ["White", "Red", "Black", "Green"];
     const regexInteger = /^[0-9]+$/;
     const buttonsSet = {
         buttons : [false, false, false, false],
         IsPressed : function(idx) {
             return this.buttons[idx] === true;
         },
         Reset: function() {
             for (let i in this.buttons) {
                 this.buttons[i] = false;
             }
         }
     };
     let history = null;
     let historicMovesArr = [];
     let movesCountToUndo = 0;
     let game = null;
     let ui = null;
     let quaternityClockDiv = null;

     const wakelockSupported = 'wakeLock' in navigator;
     let wakelockPromise = null;
     let wakelockHandle = null;
     let wakelockAcquired = false;

     function SetValueOfButtonCorrespondingToKey(event, value) {
         switch(event.code) {
             case 'KeyA':
             case 'Digit1':
                 buttonsSet.buttons[0] = value;
                 break;
             case 'KeyB':
             case 'Digit2':
                 buttonsSet.buttons[1] = value;
                 break;
             case 'KeyC':
             case 'Digit3':
                 buttonsSet.buttons[2] = value;
                 break;
             case 'KeyD':
             case 'Digit4':
                 buttonsSet.buttons[3] = value;
                 break;
         }
     }

     function OnKeyDown(event) {
         SetValueOfButtonCorrespondingToKey(event, true);
     }

     function OnKeyUp(envent) {
         SetValueOfButtonCorrespondingToKey(event, false);
     }

     document.addEventListener('keydown', OnKeyDown);
     document.addEventListener('keyup', OnKeyUp);

     function EnterFullscreen() {
         document.getElementById("quaternity-clock").requestFullscreen();
     }

     function ExitFullscreen() {
         document.exitFullscreen();
     }

     if (wakelockSupported) {
         document.addEventListener('visibilitychange', HandleVisibilityChange);
     }

     function HandleVisibilityChange() {
         if (wakelockSupported
             && GameIsInState("running")
             && (document.visibilityState === 'visible'))
         {
             AcquireWakelock();
         }
     }

     function AcquireWakelock() {
         // see: https://developer.mozilla.org/en-US/docs/Web/API/Screen_Wake_Lock_API

         if (wakelockSupported
             && (wakelockHandle === null || wakelockHandle.released)
             && wakelockPromise === null) {
             wakelockPromise = navigator.wakeLock.request('screen')
                                        .then(hdl => {
                                            wakelockPromise = null;
                                            wakelockHandle = hdl;
                                        })
                                        .catch(err => {wakelockPromise = null});
         }
     }

     function ReleaseWakelock() {
         if (wakelockHandle && !wakelockHandle.released) {
             wakelockHandle.release();
         }
     }

     function SetGameState(stateName) {
         if (quaternityClockDiv === null) {
             quaternityClockDiv = document.getElementById("quaternity-clock");
         }
         if (quaternityClockDiv !== null) {
             if (stateName !== quaternityClockDiv.dataset.gamestate) {
                 quaternityClockDiv.dataset.gamestate = stateName;
                 if (stateName === "running") {
                     AcquireWakelock();
                 } else {
                     ReleaseWakelock();
                 }
             }
         }
     }

     function GameIsInState(stateName) {
         if (quaternityClockDiv !== null) {
             return quaternityClockDiv.dataset.gamestate === stateName;
         }
         return false;
     }

     function GotoPausedStateUI(title, subtitle) {
         SetGameState("paused");
         EnableOrDisableRemovePlayerButton();
         SetPausedPanelTitle(title, subtitle);
         EnableUnpauseButtons(game.PlayersAvailableForUnpausing());
     }
     function SetPausedPanelTitle(title, subtitle) {
         document.getElementById("paused-title").textContent = title
         document.getElementById("paused-subtitle").textContent = subtitle;
     }

     function EnableUnpauseButtons(players) {
         const unpauseButtonDivs = [
             "unpause-white-div",
             "unpause-red-div",
             "unpause-black-div",
             "unpause-green-div" ];
         for (const button of unpauseButtonDivs) {
             document.getElementById(button).style.display = "none";
         }
         let order = 0;
         if (typeof players.current === 'number') {
             const button = document.getElementById(unpauseButtonDivs.at(players.current));
             button.style.display = "block";
             button.style.order =  order++;
             button.onclick = () => game.UnpauseOnCurrentPlayer();
         }
         if (typeof players.next === 'number') {
             const button = document.getElementById(unpauseButtonDivs.at(players.next));
             button.style.display = "block";
             button.style.order =  order;
             button.onclick = () => game.UnpauseOnNextPlayer();
         }
     }

     function GotoUnpausedStateUI () {
         SetGameState("running");
     }

     const checkmateBoxes = ["checkmate-p0-checkbox", "checkmate-p1-checkbox",
                             "checkmate-p2-checkbox", "checkmate-p3-checkbox"];
      const checkmateBoxDivs = ["checkmate-player0-div", "checkmate-player1-div",
                                "checkmate-player2-div", "checkmate-player3-div"];

     function OpenRemovePlayerPanel() {
         SetGameState("removing-player");

         document.getElementById("terminate-game-on-remove-panel").style.display = "none";
         for (let boxId of checkmateBoxes) {
             document.getElementById(boxId).checked=false;
         }

         const playerName = PlayerName(game.CurrentPlayerIdx());
         document.getElementById("checkmate-input").checked = true;
         document.getElementById("resign-label").textContent = `${playerName} resigned`;

         const checkmateRadioLabel = document.getElementById("checkmate-label");
         if (game.AlivePlayersCount() <= 2) {
             let otherPlayerName = "";
             checkmateBoxDivs.forEach( (divId, i) => {
                 document.getElementById(divId).style.display = "none";
                 if (game.IsPlayerActive(i) && i != game.CurrentPlayerIdx()) {
                     otherPlayerName = PlayerName(i);
                 }
             });
             checkmateRadioLabel.textContent = `${playerName} checkmated ${otherPlayerName}:`
         } else {
             checkmateRadioLabel.textContent = `${playerName} checkmated:`;
         }
         OnChangeOfPlayersToBeRemoved();
     }

     function CountRequestedCheckmates() {
         let count = 0;
         for (let boxId of checkmateBoxes) {
             if (document.getElementById(boxId).checked) {
                 count++;
             }
         }
         return count;
     }

     function ShallEnableTerminateButtonOnRemovePlayersPanel() {
         if (document.getElementById("resign-current-player-input").checked) {
             if (game.AlivePlayersCount() == 2) {
                 return true;
             }
             return false;
         }
         if (CountRequestedCheckmates() + 1 >= game.AlivePlayersCount()) {
             return true;
         }
         return false;
     }

     function DisplayStatusOfButtonsInRemovePlayersPanel() {
         if (game.AlivePlayersCount() <= 2) {
             return { terminate: true, confirm: false };
         }
         if (document.getElementById("resign-current-player-input").checked) {
             return { terminate: false, confirm: true };
         }
         const checkmatesCount = CountRequestedCheckmates();
         if (checkmatesCount + 1 >= game.AlivePlayersCount()) {
             return { terminate: true, confirm: false };
         }
         return { terminate: false, confirm: checkmatesCount > 0 };
     }

     function PlayerAfterCheckmate() {
         let p = game.NextActivePlayerIdx();
         while (p != game.CurrentPlayerIdx() && // <- should not be necessary really
                document.getElementById(checkmateBoxes[p]).checked === true)
         {
             p = game.PlayerFollowing(p);
         }
         return p;
     }

     function OnChangeOfPlayersToBeRemoved() {
         const terminateButton = document.getElementById("terminate-game-on-remove-panel");
         const unpauseButton = document.getElementById("confirm-players-removal");

         const resignationChecked = document.getElementById("resign-current-player-input").checked;
         const shallShow = DisplayStatusOfButtonsInRemovePlayersPanel();
         terminateButton.style.display = shallShow.terminate ? 'block' : 'none';
         unpauseButton.style.display = shallShow.confirm ? 'block' : 'none';
         if (shallShow.confirm) {
             // update color of unpause icon
             const p = resignationChecked ? game.NextActivePlayerIdx() : PlayerAfterCheckmate();
             document.getElementById("unpause-icon-after-player-removal").dataset.playerIndex = p;
         }
         if (resignationChecked || game.AlivePlayersCount() <= 2) {
             for (let boxDivId of checkmateBoxDivs) {
                 document.getElementById(boxDivId).style.display = "none";
             }
         } else {
             checkmateBoxDivs.forEach( (divId, i) => {
                 const checkboxElement = document.getElementById(divId);
                 const couldBeCheckmated = game.IsPlayerActive(i) && i != game.CurrentPlayerIdx();
                 checkboxElement.style.display = couldBeCheckmated ? "block" : "none";
             });
         }
     }

     function CancelRemovingPlayers() {
         SetGameState("paused");
     }

     function ConfirmRemovingPlayers() {
         if (document.getElementById("resign-current-player-input").checked) {
             game.RegisterCurrentPlayerResignation();
         } else {
             const players = [];
             checkmateBoxes.forEach( (box, i) => {
                 if (document.getElementById(box).checked) {
                     players.push(i);
                 }
             });
             game.RegisterCheckmate(players);
         }
         game.UnpauseOnCurrentPlayer();
     }

     function Pause() {
         if (game) {
             game.Pause();
         }
     }
     function OpenUndoPanel() {
         movesCountToUndo = 0;
         BuildHistoricMovesArray();
         FillUndoPanelHistory();
         SetGameState('undoing-move');
     }

     function BuildHistoricMovesArray() {
         const movesCount = history.MovesCount();
         historicMovesArr.length = 0;
         for (let i=0; i < movesCount; ++i) {
             const m = document.createElement("p");
             m.textContent = `${i+1}) ${history.GetMoveDescription(i)}`;
             historicMovesArr.push(m);
         }
     }

     function FillUndoPanelHistory() {
         const undoneMovesElement = document.getElementById("undone-moves");
         const doneMovesElement = document.getElementById("done-moves");

         undoneMovesElement.textContent = ''; // this removes all children
         doneMovesElement.textContent = ''; // this removes all children

         for (let i=0; i<movesCountToUndo; ++i) {
             undoneMovesElement.appendChild(historicMovesArr.at(-1 -i));
         }
         for (let i=movesCountToUndo; i < historicMovesArr.length; ++i) {
             doneMovesElement.appendChild(historicMovesArr.at(-1 -i));
         }
     }

     function Undo() {
         if (movesCountToUndo < historicMovesArr.length) {
             movesCountToUndo++;
             ui.UpdatePlayersClock(history.GetGameStateAt(-1 -movesCountToUndo));
             FillUndoPanelHistory();
         }
     }
     function Redo() {
         if (movesCountToUndo > 0) {
             movesCountToUndo--;
             ui.UpdatePlayersClock(history.GetGameStateAt(-1 -movesCountToUndo));
             FillUndoPanelHistory();
         }
     }
     function ConfirmUndo() {
         if (movesCountToUndo > 0) {
             game.Undo(movesCountToUndo);
             movesCountToUndo = 0;
             EnableUnpauseButtons(game.PlayersAvailableForUnpausing());
         }
         EnableOrDisableRemovePlayerButton()
         SetPausedPanelTitle('Game paused', '');
         SetGameState('paused');
     }

     function EnableOrDisableRemovePlayerButton() {
         const button = document.getElementById("remove-player-button");
         button.disabled = game.ResignationAndCheckmateShouldBeDisabled();
     }

     function PromptTerminateGame(onCancel) {
         document.getElementById("CancelTerminateButton").onclick = onCancel;
         SetGameState("confim-terminate");
     }
     function StartNewGame() {
         SetGameState("not-started");
         game = null;
         history = null;
     }
     class UI {
         constructor() {
             this.playersClocksDivs = [
                 document.getElementById("player0-clock"),
                 document.getElementById("player1-clock"),
                 document.getElementById("player2-clock"),
                 document.getElementById("player3-clock")
             ];
             for (const i in this.playersClocksDivs) {
                 this.EnablePlayer(i);
             }
         }
         AlertRunning(str) {
             GotoUnpausedStateUI();
         }
         AlertPause() {
             GotoPausedStateUI("GAME PAUSED", "");
         }
         AlertPlayerLostByTime(playerId, gameOver, playersAvailableForUnpausing) {
             const title = `${playersNames[playerId]} lost by timeout`;
             if (gameOver) {
                 this.AlertGameOver(title);
             } else {
                 SetGameState("paused");
                 EnableOrDisableRemovePlayerButton();
                 SetPausedPanelTitle(title, "");
                 EnableUnpauseButtons(playersAvailableForUnpausing);
             }
         }
         AlertGameOver(subtitle) {
             SetGameState("over");
             SetPausedPanelTitle("GAME OVER", subtitle);
             game = null;
         }
         SetPlayerStatus(playerId, s)
         {
             this.playersClocksDivs[playerId].dataset.playerstate = s;
         }
         HighlightPlayer(playerId) {
             this.SetPlayerStatus(playerId, "current");
         }
         UnhighlightPlayer(playerId) {
             this.SetPlayerStatus(playerId, "waiting");
         }
         DisablePlayer(playerId) {
             this.SetPlayerStatus(playerId, "disabled");
         }
         EnablePlayer(playerId) {
             this.SetPlayerStatus(playerId, "waiting");
         }
         UpdatePlayerRemainingTime(playerId, remainingTime_ms) {
             if (remainingTime_ms == 0) {
                 this.SetPlayerRemainingTimeToZero(playerId);
             } else {
                 let seconds_sum = Math.ceil(remainingTime_ms / 1000.0);
                 let minutes_sum = Math.floor(seconds_sum / 60.0);
                 let hours = Math.floor(minutes_sum / 60.0);
                 let seconds = seconds_sum - minutes_sum * 60.0;
                 let minutes = minutes_sum - hours * 60.0;
                 let minutesStr = minutes >= 10 ? `${minutes}` : `0${minutes}`;
                 let secondsStr = seconds >= 10 ? `${seconds}` : `0${seconds}`;

                 this.playersClocksDivs[playerId].textContent =
                     `${hours}:${minutesStr}:${secondsStr}`;
             }
         }
         SetPlayerRemainingTimeToZero(playerId) {
             this.playersClocksDivs[playerId].textContent = "00:00:00";
         }

         _PlayerClockStatus(gameState, playerIdx) {
             if (! gameState.players.at(playerIdx).onGame) {
                 return "disabled";
             }
             if (playerIdx == gameState.playerIdx) {
                 return "current";
             }
             return "waiting";
         }
         UpdatePlayersClock(gameState) {
             for (let playerIdx in gameState.players) {
                 this.SetPlayerStatus(playerIdx, this._PlayerClockStatus(gameState, playerIdx));
                 const player = gameState.players.at(playerIdx);
                 this.UpdatePlayerRemainingTime(playerIdx, player.remainingTime_ms);
             }
         }
     }

     function GetFirstGamepad() {
         const gamepads = navigator.getGamepads();
         if (gamepads != null && gamepads[0] != null) {
             return gamepads[0];
         }
         return null;
     }

     function IsInteger(str) {
         return str === "" || regexInteger.test(str);
     }

     function ToInt(str) {
         return str === "" ?  0 : parseInt(str);
     }

     function Start() {
         let minutesStr =  document.getElementById("minutes").value;
         let secondsStr =  document.getElementById("seconds").value;
         let addSecsStr = document.getElementById("addSecondsEachMove").value;
         if (IsInteger(minutesStr) && IsInteger(secondsStr) && IsInteger(addSecsStr)) {
             let minutes = ToInt(minutesStr);
             let seconds = ToInt(secondsStr) + minutes * 60;
             let addSecs = ToInt(addSecsStr);
             if (seconds > 0) {
                 DoStart(seconds, addSecs);
                 return;
             }
         }
         document.getElementById("start-panel-error").textContent = "Invalid Input";
     }

     function DoStart(time_sec, addSecs) {
         const players = [
             new QuaternityPlayerTimeCounter(time_sec, addSecs),
             new QuaternityPlayerTimeCounter(time_sec, addSecs),
             new QuaternityPlayerTimeCounter(time_sec, addSecs),
             new QuaternityPlayerTimeCounter(time_sec, addSecs)
         ];
         ui = new UI();
         for (const i in players) {
             ui.UpdatePlayerRemainingTime(i, players[i].RemainingTime_ms())
         }
         buttonsSet.Reset();
         history = new QuaternityGameHistory(new RecoverableGameState(players, 0));
         game = new QuaternityClock(players, ui, buttonsSet, history);
         game.UnpauseOnCurrentPlayer();
     }

    </script>
  </head>
  <body>
    <div id="quaternity-clock" data-gamestate="not-started">
      <div id="start-panel-div">
        <div class="time-inputs">
          <div>
            <fieldset>
              <legend>
                Time per player:
              </legend>
              <div class="inside-legend">
                Time per player:
              </div>
              <div>
                <input id="minutes" type="number" min="0" max="9999" value="12">
                min
              </div>
              <div>
                <input id="seconds" type="number" min="0" max="59"  value="00">
                sec
              </div>
            </fieldset>
          </div>
          <div>
            <fieldset>
              <legend>
                Extra per move:
              </legend>
              <div class="inside-legend">
                Extra per move:
              </div>
              <div>
                <input id="addSecondsEachMove" type="number" min="0" max="59" step="1" value="5">
                sec
              </div>
            </fieldset>
          </div>
        </div>
        <div id="start-panel-buttons-div">
          <div class="button-div when-not-on-fullscreen">
            <button onclick="EnterFullscreen()">
              Enter fullscreen
            </button>
          </div>

          <div class="button-div when-on-fullscreen">
            <button onclick="ExitFullscreen()">
              Quit fullscreen
            </button>
          </div>

          <div id="start-button-div">
            <button id="start-button" onClick="Start()">
              Start
            </button>
          </div>
        </div>

        <div id="start-panel-error">
        </div>
      </div>

      <div id="confirm-terminate-panel-div">
        <div>Terminate game?</div>
        <div>
          <button id="CancelTerminateButton" onclick="SetGameState('paused')">
            Cancel
          </button>
          <button onclick="StartNewGame()">
            Terminate
          </button>
        </div>
      </div>
      <div id="game-panel">
        <div id="paused-state-pannel">

          <div id="paused-title-div">
            <div id="paused-title">
            </div>
            <div id="paused-subtitle">
            </div>
          </div>

          <div id="unpause-buttons-div">
            <fieldset style="width:80%;margin:auto">
              <legend>
                Unpause on:
              </legend>

              <div id="unpause-buttons-container">
                <div id="unpause-white-div">
                  <!-- see https://www.kirupa.com/web/changing_colors_svg_css_javascript.htm -->
                  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="grad1" cx="70%" cy="30%" r="70%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="lightgrey" />
                        <stop offset="100%" stop-color="grey" />
                      </radialGradient>
                    </defs>
                    <circle r="48" cx="50" cy="50" fill="url(#grad1)"
                            stroke="black" stroke-width="2"/>
                    <polygon points="30,15.36 90,50 30,84.64" fill="white"
                             stroke="gray" stroke-width="2"/>
                  </svg>
                </div>


                <div id="unpause-red-div">
                  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="grad2" cx="70%" cy="30%" r="70%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="lightgrey" />
                        <stop offset="100%" stop-color="grey" />
                      </radialGradient>
                    </defs>
                    <circle r="48" cx="50" cy="50" fill="url(#grad2)"
                            stroke="black" stroke-width="2"/>
                    <polygon points="30,15.36 90,50 30,84.64" fill="red"
                             stroke="gray" stroke-width="2"/>
                  </svg>
                </div>


                <div id="unpause-black-div">
                  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="grad3" cx="70%" cy="30%" r="70%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="lightgrey" />
                        <stop offset="100%" stop-color="grey" />
                      </radialGradient>
                    </defs>
                    <circle r="48" cx="50" cy="50" fill="url(#grad3)"
                            stroke="black" stroke-width="2"/>
                    <polygon points="30,15.36 90,50 30,84.64" fill="black"
                             stroke="gray" stroke-width="2"/>
                  </svg>
                </div>


                <div id="unpause-green-div">
                  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="grad4" cx="70%" cy="30%" r="70%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="lightgrey" />
                        <stop offset="100%" stop-color="grey" />
                      </radialGradient>
                    </defs>
                    <circle r="48" cx="50" cy="50" fill="url(#grad4)"
                            stroke="black" stroke-width="2"/>
                    <polygon points="30,15.36 90,50 30,84.64" fill="green"
                             stroke="gray" stroke-width="2"/>
                  </svg>
                </div>

              </div>
            </fieldset>
          </div>
          <div id="paused-panel-buttons-div">

            <div class="button-div" id="remove-player-button-div">
              <button onclick="OpenRemovePlayerPanel()" id ="remove-player-button">
                Remove player
              </button>
            </div>

            <div class="button-div" id="undo-button-div">
              <button onclick="OpenUndoPanel()">
                Undo
              </button>
            </div>

            <div class="button-div when-not-on-fullscreen">
              <button onclick="EnterFullscreen()">
                Enter fullscreen
              </button>
            </div>

            <div class="button-div when-on-fullscreen">
              <button onclick="ExitFullscreen()" >
                Quit fullscreen
              </button>
            </div>

            <div class="button-div" id="terminate-game-button-div">
              <button onclick="PromptTerminateGame( ()=>{SetGameState('paused')} )" >
                Terminate game
              </button>
            </div>

            <div class="button-div" id="new-game-button-div">
              <button onclick="StartNewGame()" style="width:80%">
                Start new game
              </button>
            </div>

          </div>
        </div>

        <div id="remove-players-panel">
          <div id="resign-current-player-div">
            <input type="radio" name="remove-player-radio-group"
                   onchange="OnChangeOfPlayersToBeRemoved()"
                   id="resign-current-player-input"/>
            <label id="resign-label">
              Current player resigned
            </label>
          </div>
          <div id="checkmate-div">
            <input type="radio" name="remove-player-radio-group" checked
                   onchange="OnChangeOfPlayersToBeRemoved()"
                   id="checkmate-input"/>
            <label id="checkmate-label">
                Checkmate:
            </label>
          </div>
          <div>
            <div id="checkmate-boxes">

              <div class="player0-cell" id="checkmate-player0-div">
                <label>
                  <input type="checkbox" id="checkmate-p0-checkbox"
                         onchange="OnChangeOfPlayersToBeRemoved()""/>
                  White
                </label>
              </div>

              <div class="player1-cell" id="checkmate-player1-div">
                <label>
                  <input type="checkbox" id="checkmate-p1-checkbox"
                         onchange="OnChangeOfPlayersToBeRemoved()""/>
                  Red
                </label>
              </div>

              <div class="player2-cell" id="checkmate-player2-div">
                <label>
                  <input type="checkbox" id="checkmate-p2-checkbox"
                         onchange="OnChangeOfPlayersToBeRemoved()""/>
                  Black
                </label>
              </div>

              <div class="player3-cell" id="checkmate-player3-div">
                <label>
                  <input type="checkbox" id="checkmate-p3-checkbox"
                         onchange="OnChangeOfPlayersToBeRemoved()""/>
                  Green
                </label>
              </div>
            </div>
          </div>

          <div id="remove-players-panel-buttons">
            <div>
            <button onclick="CancelRemovingPlayers()">
              Cancel
            </button>
            </div>
            <div>
              <button id="confirm-players-removal" onclick="ConfirmRemovingPlayers()">
                Confirm
                <svg id="unpause-icon-after-player-removal" class="unpause-button"
                    viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="grad1" cx="70%" cy="30%" r="70%" fx="50%" fy="50%">
                      <stop offset="0%" stop-color="lightgrey" />
                      <stop offset="100%" stop-color="grey" />
                    </radialGradient>
                  </defs>
                  <circle r="48" cx="50" cy="50" fill="url(#grad1)"
                          stroke="yellow" stroke-width="2"/>
                  <polygon points="30,15.36 90,50 30,84.64" fill="yellow"
                           stroke="gray" stroke-width="2"/>
                </svg>
            </button>
            <button id="terminate-game-on-remove-panel"
                    onclick="PromptTerminateGame(()=>{SetGameState('removing-player')})">
              Terminate game
            </button>
            </div>
          </div>

        </div>

        <div id="undo-panel">
          <div id="game-history">
            <div class="header">
              History
            </div>
            <div id="history-events">
              <div id="undone-moves">
              </div>
              <hr/>
              <div id="done-moves">
              </div>
            </div>
          </div>
          <div id="undo-redo-buttons">
            <button onclick="Undo()">
              Undo
            </button>

            <button onclick="Redo()">
              Redo
            </button>

            <button onclick="ConfirmUndo()">
              Done
            </button>
          </div>
        </div>

        <div class="players-grid" id="clocks-container">
          <div class="player-clock player0-cell" id="player0-clock">0:00:00</div>
          <div class="player-clock player1-cell" id="player1-clock">0:00:00</div>
          <div class="player-clock player2-cell" id="player2-clock">0:00:00</div>
          <div class="player-clock player3-cell" id="player3-clock">0:00:00</div>
        </div>

        <div id="keyboard-div">
          <button id="pause-button" onclick="Pause()">
            PAUSE
          </button>
        </div>

      </div>
    </div>
  </body>
</html>
